<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true">
  <title>No alerts — all clear</title>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- calm bell -->
    <g transform="translate(160 96)">
      <path d="M0 -42 C-26 -42 -38 -24 -38 0 V16 L-48 30 H48 L38 16 V0 C38 -24 26 -42 0 -42 Z"
            fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-opacity="0.6" stroke-width="2.5"/>
      <path d="M-14 38 A14 14 0 0 0 14 38" stroke="#4ade80" stroke-opacity="0.6" stroke-width="2.5"/>
      <circle cx="0" cy="-50" r="6" fill="#4ade80" fill-opacity="0.45" stroke="none"/>
      <!-- clapper check = all clear -->
      <path d="M-9 2 L-2 10 L11 -6" stroke="#4ade80" stroke-opacity="0.9" stroke-width="2.5"/>
    </g>

    <!-- sound waves, muted (calm, not alarming) -->
    <g stroke="#4ade80" stroke-width="2">
      <path d="M96 62 C108 74 108 118 96 130" stroke-opacity="0.28"/>
      <path d="M224 62 C212 74 212 118 224 130" stroke-opacity="0.28"/>
    </g>

    <!-- calm horizon line -->
    <path d="M40 168 H280" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M96 160 L128 158 L160 162 L192 157 L224 160" stroke="#4ade80" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>