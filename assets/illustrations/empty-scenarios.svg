<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true">
  <title>No scenario heatmap yet</title>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 5x4 heat grid: reds top-left, greens bottom-right -->
    <g stroke-width="1.5">
      <!-- row 1 -->
      <rect x="56" y="42" width="40" height="26" rx="4" fill="#f87171" fill-opacity="0.42" stroke="#f87171" stroke-opacity="0.35"/>
      <rect x="102" y="42" width="40" height="26" rx="4" fill="#f87171" fill-opacity="0.3" stroke="#f87171" stroke-opacity="0.28"/>
      <rect x="148" y="42" width="40" height="26" rx="4" fill="#facc15" fill-opacity="0.2" stroke="#facc15" stroke-opacity="0.22"/>
      <rect x="194" y="42" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.2"/>
      <rect x="240" y="42" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.28" stroke="#4ade80" stroke-opacity="0.32"/>
      <!-- row 2 -->
      <rect x="56" y="74" width="40" height="26" rx="4" fill="#f87171" fill-opacity="0.28" stroke="#f87171" stroke-opacity="0.26"/>
      <rect x="102" y="74" width="40" height="26" rx="4" fill="#facc15" fill-opacity="0.2" stroke="#facc15" stroke-opacity="0.22"/>
      <rect x="148" y="74" width="40" height="26" rx="4" fill="#facc15" fill-opacity="0.26" stroke="#facc15" stroke-opacity="0.28"/>
      <rect x="194" y="74" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.24" stroke="#4ade80" stroke-opacity="0.28"/>
      <rect x="240" y="74" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.38" stroke="#4ade80" stroke-opacity="0.42"/>
      <!-- row 3 -->
      <rect x="56" y="106" width="40" height="26" rx="4" fill="#f87171" fill-opacity="0.16" stroke="#f87171" stroke-opacity="0.2"/>
      <rect x="102" y="106" width="40" height="26" rx="4" fill="#facc15" fill-opacity="0.24" stroke="#facc15" stroke-opacity="0.26"/>
      <rect x="148" y="106" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-opacity="0.22"/>
      <rect x="194" y="106" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.32" stroke="#4ade80" stroke-opacity="0.36"/>
      <rect x="240" y="106" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.46" stroke="#4ade80" stroke-opacity="0.5"/>
      <!-- row 4 -->
      <rect x="56" y="138" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.18"/>
      <rect x="102" y="138" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.24"/>
      <rect x="148" y="138" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.34" stroke="#4ade80" stroke-opacity="0.38"/>
      <rect x="194" y="138" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.46" stroke="#4ade80" stroke-opacity="0.5"/>
      <rect x="240" y="138" width="40" height="26" rx="4" fill="#4ade80" fill-opacity="0.58" stroke="#4ade80" stroke-opacity="0.62"/>
    </g>

    <!-- diagonal sweep arrow (shock magnitude increasing) -->
    <path d="M42 176 C104 176 178 172 292 152" stroke="#4fc3f7" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M282 147 L293 151 L287 160" stroke="#4fc3f7" stroke-opacity="0.65" stroke-width="2"/>

    <!-- axis ticks -->
    <path d="M56 34 V40 M102 34 V40 M148 34 V40 M194 34 V40 M240 34 V40" stroke="currentColor" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M44 42 H50 M44 74 H50 M44 106 H50 M44 138 H50" stroke="currentColor" stroke-opacity="0.2" stroke-width="2"/>
  </g>
</svg>