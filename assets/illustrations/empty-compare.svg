<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true">
  <title>Pick two deals to compare</title>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left panel: better deal (green) -->
    <rect x="34" y="36" width="104" height="128" rx="10"
          fill="#4ade80" fill-opacity="0.07" stroke="#4ade80" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M52 60 H120" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M52 78 H108" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M52 96 H116" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="126" cy="52" r="11" fill="#4ade80" fill-opacity="0.3" stroke="#4ade80" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M120 52 L125 57 L133 47" stroke="#4ade80" stroke-opacity="0.9" stroke-width="2.5"/>

    <!-- right panel: weaker deal (amber) -->
    <rect x="182" y="36" width="104" height="128" rx="10"
          fill="#facc15" fill-opacity="0.06" stroke="#facc15" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M200 60 H268" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M200 78 H256" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M200 96 H264" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="274" cy="52" r="11" fill="#facc15" fill-opacity="0.25" stroke="#facc15" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M269 47 L279 57 M279 47 L269 57" stroke="#facc15" stroke-opacity="0.85" stroke-width="2.5"/>

    <!-- centre divider with comparison glyph -->
    <path d="M160 46 V154" stroke="currentColor" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 6"/>
    <g transform="translate(160 100)">
      <circle r="15" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.3" stroke-width="2"/>
      <path d="M-6 -5 L0 -11 L6 -5" stroke="#4fc3f7" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-6 5 L0 11 L6 5" stroke="#4fc3f7" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- verdict bar underneath -->
    <path d="M86 176 H234" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="110" cy="176" r="4" fill="#4ade80" fill-opacity="0.5" stroke="none"/>
    <circle cx="210" cy="176" r="4" fill="#facc15" fill-opacity="0.45" stroke="none"/>
  </g>
</svg>