name: CI

on:
  push:
    branches: [main, enhance/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. JavaScript syntax check (every .js file passes `node --check`) ──
  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse every JS file
        run: |
          set -e
          FAIL=0
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            if node --check "$f"; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi

  # ── 2. JSDoc typedef sanity — every @typedef has a matching usage ──
  jsdoc-sanity:
    name: JSDoc typedef sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JSDoc typedefs in js/types.js are referenced from app.js
        run: |
          set -e
          TYPEDEFS=$(grep -E '^@typedef \{' js/types.js | sed -E 's/.*\{[^}]+\} *//' | awk '{print $1}' | sort -u)
          echo "typedefs declared:"
          echo "$TYPEDEFS"
          MISSING=0
          for t in $TYPEDEFS; do
            # Count usages anywhere except in js/types.js itself
            USES=$(grep -rE "($t\\b)" --include='*.js' --include='*.html' . \
                   | grep -v 'js/types.js' \
                   | wc -l | tr -d ' ')
            if [ "$USES" -eq 0 ]; then
              echo "  ⚠ typedef '$t' is declared but never used"
            else
              echo "  ✓ typedef '$t' used in $USES location(s)"
            fi
          done

  # ── 3. Required-file presence ────────────────────────────────────────
  required-files:
    name: Required files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check expected files exist
        run: |
          set -e
          REQUIRED=(
            index.html
            app.js
            style.css
            js/db.js
            js/storage.js
            js/yahoo-finance.js
            js/finnhub.js
            js/sectors.js
            js/payoff.js
            js/fx.js
            js/health.js
            js/calendar.js
            js/watchlist.js
            js/alerts.js
            js/types.js
            tests.html
            manifest.webmanifest
            sw.js
            README.md
            LICENSE
            .gitignore
            .nojekyll
          )
          for f in "${REQUIRED[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f MISSING"
              exit 1
            fi
          done

          # Every empty-state illustration the app references must exist,
          # otherwise a view silently renders a broken image.
          echo ""
          echo "illustration assets:"
          for a in empty-deals empty-payoff empty-scenarios empty-calendar \
                   empty-watchlist empty-compare empty-alerts hero; do
            if [ -f "assets/illustrations/$a.svg" ]; then
              python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/illustrations/$a.svg')" \
                && echo "  ✓ assets/illustrations/$a.svg"
            else
              echo "  ✗ assets/illustrations/$a.svg MISSING"
              exit 1
            fi
          done

  # ── 4. JSON validity (workflow + manifest + .db backups don't break parsing) ──
  json-validity:
    name: JSON files valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest + workflow files
        run: |
          set -e
          for f in manifest.webmanifest .github/workflows/ci.yml .github/workflows/deploy.yml; do
            if [ -f "$f" ]; then
              if python3 -c "import json,sys; json.load(open('$f')) if '$f'.endswith('.webmanifest') else None"; then
                if [[ "$f" == *.webmanifest ]]; then
                  python3 -c "import json; json.load(open('$f'))" && echo "  ✓ $f"
                else
                  # YAML files — just ensure they're non-empty
                  [ -s "$f" ] && echo "  ✓ $f (yaml, non-empty)"
                fi
              fi
            fi
          done

  # ── 5. HTML smoke check (file exists, has <!DOCTYPE html>, has </body>) ──
  html-smoke:
    name: HTML files smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML files look right
        run: |
          set -e
          for f in index.html tests.html; do
            head -1 "$f" | grep -qi '<!DOCTYPE' && echo "  ✓ $f has DOCTYPE"
            grep -qi '</body>' "$f" && echo "  ✓ $f has </body>"
            grep -qi '</html>' "$f" && echo "  ✓ $f has </html>"
          done

  # ── 6. JSDoc / license sanity ────────────────────────────────────────
  package-meta:
    name: README + license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README links work locally
        run: |
          set -e
          # README should mention at least the main JS module
          grep -qi 'js/db.js\|Storage\|SQLite' README.md && echo "  ✓ README mentions core modules"
          # License should be MIT
          head -3 LICENSE | grep -qi 'MIT' && echo "  ✓ LICENSE is MIT"
  # ── 7. XSS gate ──────────────────────────────────────────────────────
  # Deal names, issuers and symbols can arrive from a CSV or JSON import,
  # so concatenating them straight into innerHTML is a stored-XSS vector.
  # Any new occurrence has to go through escapeHtml().
  xss-gate:
    name: No unescaped user data in innerHTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for raw field concatenation
        run: |
          set -e
          echo "Scanning app.js for unescaped deal fields in HTML strings…"
          # Match `+ deal.field +` / `+ d.field +` / `+ a.field +` where the
          # field is user-supplied and the line does NOT call escapeHtml.
          HITS=$(grep -nE "\+ ?(deal|d|a)\.(dealName|issuer|symbol|name|status|settlementMethod) ?\+" app.js \
                 | grep -v 'escapeHtml' \
                 | grep -v "ALERT-" \
                 || true)
          if [ -n "$HITS" ]; then
            echo "  ✗ unescaped user data found in innerHTML:"
            echo "$HITS"
            echo ""
            echo "Wrap the value in escapeHtml()."
            exit 1
          fi
          echo "  ✓ no unescaped deal fields concatenated into HTML"

      - name: escapeHtml must exist and cover all five metacharacters
        run: |
          set -e
          grep -q 'function escapeHtml' app.js && echo "  ✓ app.js defines escapeHtml"
          grep -q 'function escapeHtml' js/alerts.js && echo "  ✓ js/alerts.js defines escapeHtml"
          for ch in '&' '<' '>' '"' "'"; do
            grep -q -- "$ch" <(sed -n '/function escapeHtml/,/^  }/p' app.js) \
              && echo "  ✓ escapeHtml handles $ch" \
              || { echo "  ✗ escapeHtml missing $ch"; exit 1; }
          done
  # ── 8. Supply chain: third-party assets must be pinned + SRI ────────
  # An unversioned CDN script means a breaking upstream release can break
  # every chart in the app with no code change and no way to bisect it.
  dep-pinning:
    name: CDN deps pinned with SRI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every remote <script>/<link> carries a version and an integrity hash
        run: |
          set -e
          python3 - <<'PY'
          import re, sys
          src = open('index.html').read()
          # Remote assets = anything pulling from a CDN.
          remote = re.findall(r'<(script|link)\b[^>]*\b(?:src|href)="(https?://[^"]+)"[^>]*>', src, re.I)
          if not remote:
              print('  ✗ no remote assets found — is index.html malformed?'); sys.exit(1)
          bad = []
          for tag, url in remote:
              # Two pinning styles: npm/jsdelivr uses @x.y.z,
              # cdnjs embeds the version in the path (/libs/x/6.5.2/).
              pinned = bool(re.search(r'@v?\d+\.\d+', url)) or \
                       bool(re.search(r'/ajax/libs/[^/]+/\d+\.\d+', url))
              # SRI + crossorigin live on the same element as the URL.
              block = re.search(r'<%s\b[^>]*%s[^>]*>' % (tag, re.escape(url)), src, re.I)
              blk = block.group(0) if block else ''
              has_sri = 'integrity=' in blk
              has_co = 'crossorigin=' in blk
              ok = pinned and has_sri and has_co
              print(('  ✓ ' if ok else '  ✗ ') + url.split('/')[-1][:58])
              if not ok:
                  why = []
                  if not pinned: why.append('unpinned version')
                  if not has_sri: why.append('no integrity')
                  if not has_co: why.append('no crossorigin')
                  bad.append(url + '  (' + ', '.join(why) + ')')
          if bad:
              print('')
              print('Unpinned / unverified remote assets:')
              for b in bad: print('  - ' + b)
              sys.exit(1)
          print('  ✓ all %d remote assets are version-pinned with SRI' % len(remote))
          PY
