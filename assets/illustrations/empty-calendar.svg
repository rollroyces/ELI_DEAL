<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true">
  <title>No cash-flow events yet</title>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- ── calendar page (stronger strokes, top-left) ── -->
    <g transform="translate(28 20)">
      <rect x="0" y="0" width="104" height="86" rx="8"
            fill="#4fc3f7" fill-opacity="0.06" stroke="#4fc3f7" stroke-opacity="0.5" stroke-width="2.5"/>
      <path d="M0 22 H104" stroke="#4fc3f7" stroke-opacity="0.5" stroke-width="2.5"/>
      <path d="M26 -8 V10 M78 -8 V10" stroke="#4fc3f7" stroke-opacity="0.6" stroke-width="2.5"/>
      <g stroke-width="0">
        <!-- header row -->
        <rect x="18" y="12" width="26" height="5" rx="2.5" fill="#4fc3f7" fill-opacity="0.45"/>
        <!-- grid: one highlighted coupon day, rest muted -->
        <circle cx="26" cy="44" r="6" fill="#4ade80" fill-opacity="0.75"/>
        <circle cx="52" cy="44" r="5" fill="currentColor" fill-opacity="0.16"/>
        <circle cx="78" cy="44" r="5" fill="currentColor" fill-opacity="0.16"/>
        <circle cx="26" cy="68" r="5" fill="currentColor" fill-opacity="0.16"/>
        <circle cx="52" cy="68" r="6.5" fill="#4fc3f7" fill-opacity="0.6"/>
        <circle cx="78" cy="68" r="5" fill="currentColor" fill-opacity="0.16"/>
      </g>
    </g>

    <!-- ── connector from calendar to timeline ── -->
    <path d="M138 96 C160 96 168 116 186 122" stroke="currentColor" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 5"/>

    <!-- ── cash-flow timeline ── -->
    <path d="M24 140 H292" stroke="currentColor" stroke-opacity="0.22" stroke-width="2.5"/>

    <!-- coupon nodes -->
    <g>
      <circle cx="58" cy="140" r="11" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2.5"/>
      <circle cx="58" cy="140" r="4" fill="#4ade80" fill-opacity="0.55" stroke="none"/>
      <circle cx="118" cy="140" r="11" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2.5"/>
      <circle cx="118" cy="140" r="4" fill="#4ade80" fill-opacity="0.55" stroke="none"/>
      <circle cx="178" cy="140" r="11" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2.5"/>
      <circle cx="178" cy="140" r="4" fill="#4ade80" fill-opacity="0.55" stroke="none"/>
    </g>

    <!-- maturity flag (larger, sits on the rail) -->
    <g transform="translate(256 140)">
      <path d="M0 0 V-40" stroke="#4fc3f7" stroke-opacity="0.9" stroke-width="2.5"/>
      <path d="M0 -40 L24 -32 L0 -24 Z" fill="#4fc3f7" fill-opacity="0.42" stroke="#4fc3f7" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="9" fill="#4fc3f7" fill-opacity="0.22" stroke="#4fc3f7" stroke-opacity="0.85" stroke-width="2.5"/>
    </g>

    <!-- accumulating cash-flow trend beneath -->
    <path d="M30 178 L92 172 L154 164 L216 154 L262 140" stroke="currentColor" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M24 186 H292" stroke="currentColor" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>