<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storage layer test — HK ELI</title>
  <style>
    body { font: 14px/1.4 -apple-system, system-ui, monospace; max-width: 760px;
           margin: 32px auto; padding: 0 20px; color: #eaeaea; background: #0e1116; }
    h1   { color: #4fc3f7; font-size: 18px; }
    h2   { color: #b0bec5; font-size: 14px; margin-top: 24px; }
    pre  { background: #161b22; border: 1px solid #30363d; border-radius: 6px;
           padding: 12px; overflow-x: auto; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    .note { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <h1>HK ELI Portfolio Manager — storage smoke test</h1>
  <p class="note">Open <code>https://rollroyces.github.io/ELI_DEAL/tests.html</code> in any browser (or just this page locally). The test runs in your browser and verifies the same <code>Storage</code> module used by the main app.</p>
  <pre id="out">Running…</pre>

  <!-- Load the same modules the main app uses -->
  <script src="js/storage.js"></script>
  <script>
    var out = document.getElementById('out');
    function log(line) { out.textContent += '\n' + line; }
    function pass(t)  { log('✓ PASS  ' + t); passed++; }
    function fail(t, e){ log('✗ FAIL  ' + t + (e ? '  — ' + e : '')); failed++; }
    var passed = 0, failed = 0;

    try {
      // ─── Test 1: module loads
      if (typeof window.Storage === 'object' &&
          typeof window.Storage.addDeal === 'function') {
        pass('Storage module loaded');
      } else fail('Storage module loaded');

      // ─── Test 2: clean slate
      localStorage.removeItem('eli_deals_v1');
      if (Storage.getDeals().length === 0) pass('clean slate (no deals)');
      else fail('clean slate');

      // ─── Test 3: addDeal writes through to localStorage
      var deal = {
        dealName: 'Tencent + Alibaba Basket',
        investmentDate: '2025-09-01',
        maturityDate:   '2026-06-01',
        nominalAmount:   200000,
        purchasePrice:   196000,
        numberOfStocks:  2,
        couponRate:      12.5,
        settlementMethod:'Worst Performer Physical',
        issuer:          'Credit Suisse',
        status:          'Active',
        currentValue:    196000,
        pnl:             0,
        underlyingAssets:[
          {symbol:'0700.HK', name:'Tencent Holdings Ltd', strikePrice:380, barrierLevel:304, weight:0.5, currentPrice:410},
          {symbol:'9988.HK', name:'Alibaba Group',        strikePrice:95,  barrierLevel:76,  weight:0.5, currentPrice:90}
        ]
      };
      var saved = Storage.addDeal(deal);
      if (saved && saved.id) pass('addDeal returns an id (' + saved.id + ')');
      else fail('addDeal returns an id');

      var raw = localStorage.getItem('eli_deals_v1');
      if (raw && raw.indexOf('Tencent + Alibaba Basket') !== -1) pass('localStorage[eli_deals_v1] contains the deal');
      else fail('localStorage write');

      var round = JSON.parse(raw);
      if (round.length === 1 && round[0].dealName === deal.dealName) pass('round-trip JSON parse matches');
      else fail('round-trip JSON parse');

      // ─── Test 4: getDeals returns same data
      var back = Storage.getDeals();
      if (back.length === 1 && back[0].dealName === 'Tencent + Alibaba Basket') pass('getDeals returns saved deal');
      else fail('getDeals returns saved deal');

      // ─── Test 5: updateDeal modifies in place
      Storage.updateDeal(saved.id, { status: 'Knock-in Triggered', pnl: -5000 });
      var after = Storage.getDeals()[0];
      if (after.status === 'Knock-in Triggered' && after.pnl === -5000) pass('updateDeal mutates status and pnl');
      else fail('updateDeal: got ' + after.status + ' / ' + after.pnl);

      // ─── Test 6: deleteDeal removes
      var removed = Storage.deleteDeal(saved.id);
      if (removed && Storage.getDeals().length === 0) pass('deleteDeal removes the deal');
      else fail('deleteDeal');

      // ─── Test 7: persistence across "page reload" (simulated by re-reading localStorage)
      Storage.addDeal(deal);
      var saved2 = Storage.getDeals();
      // Now simulate reload by re-reading the raw localStorage value
      var reloadRaw = localStorage.getItem('eli_deals_v1');
      var reloadDeals = JSON.parse(reloadRaw);
      if (reloadDeals.length === 1 && reloadDeals[0].dealName === deal.dealName)
        pass('data survives a "reload" (raw localStorage read)');
      else fail('data survives a reload');

      // ─── Test 8: exportAll produces a valid backup payload
      var exp = Storage.exportAll();
      if (exp.schemaVersion === 1 && Array.isArray(exp.deals) && exp.deals.length === 1)
        pass('exportAll returns {schemaVersion, deals, settings, exportedAt}');
      else fail('exportAll');

      // ─── Test 9: importAll round-trips
      Storage.replaceAllDeals([]);
      if (Storage.getDeals().length === 0) pass('replaceAllDeals([]) clears storage');
      else fail('replaceAllDeals');

      Storage.importAll(exp);
      if (Storage.getDeals().length === 1) pass('importAll restores the deal');
      else fail('importAll');

      // ─── Test 10: settings persistence
      Storage.setSettings({ finnhubApiKey: 'test-key', alertThresholdPct: 15 });
      var s = Storage.getSettings();
      if (s.finnhubApiKey === 'test-key' && s.alertThresholdPct === 15)
        pass('setSettings / getSettings persists user config');
      else fail('settings persistence');

      // ─── Cleanup test data so the main app starts clean
      localStorage.removeItem('eli_deals_v1');
      localStorage.removeItem('eli_settings_v1');

    } catch (e) {
      fail('unhandled exception', e.message);
    }

    log('');
    log('─────────────────────────────────────');
    log('  ' + passed + ' passed,  ' + failed + ' failed');
    log('─────────────────────────────────────');
    if (failed === 0) {
      log('');
      log('All storage operations work as designed.');
      log('Your deals will be saved instantly to localStorage on Add/Edit/Delete.');
    }
  </script>
</body>
</html>
